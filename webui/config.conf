# WebUI 配置文件
# 注意：修改后需要重启 WebUI 服务才能生效

# WebUI 监听端口
PORT=5000

# WebUI 监听地址（0.0.0.0 表示监听所有网络接口）
HOST=0.0.0.0

# 调试模式（true/false）
DEBUG=false

# Flask Secret Key（生产环境请修改）
SECRET_KEY=dev-secret-key-change-in-production

# GitHub Webhook Secret
WEBHOOK_SECRET=shell-utils-webhook-secret

[webui]
port=5000
host=0.0.0.0
debug=false
secret_key=dev-secret-key-change-in-production
webhook_secret=shell-utils-webhook-secret

[database]
# PostgreSQL 数据库配置
host=localhost
port=5432
name=webui
user=webui
password=webui
