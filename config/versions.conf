# Shell Utils 配置文件
# 软件版本配置

# Web 服务器
NGINX_VERSION=1.24
APACHE_VERSION=2.4

# 编程语言
PHP_VERSION=8.0
PYTHON_VERSION=3.11
NODEJS_VERSION=20
JAVA_VERSION=11
GO_VERSION=1.22
RUBY_VERSION=3.2
PERL_VERSION=5.36

# 数据库
MARIADB_VERSION=10.5
MYSQL_VERSION=8.0
POSTGRESQL_VERSION=15
MONGODB_VERSION=6.0
CLICKHOUSE_VERSION=23.8

# 消息队列和缓存
REDIS_VERSION=7.2
RABBITMQ_VERSION=3.12
KAFKA_VERSION=3.6
ZOOKEEPER_VERSION=3.9

# 安装选项
INSTALL_DIR="/opt"
DATA_DIR="/var/lib"
LOG_DIR="/var/log"
BACKUP_DIR="/var/backups"

# 防火墙配置
CONFIGURE_FIREWALL=true
OPEN_PORTS=(80 443)

# 服务启动
AUTO_START=true
