# 场景 7: 完整生产环境 - 双节点架构
# 主节点处理请求，从节点接收副本
upstream primary {
    server 10.0.0.1:8080;
}

upstream secondary {
    server 10.0.0.2:8080;
}

server {
    listen 80;
    server_name www.example.com;

    location / {
        # 主请求到主节点
        proxy_pass http://primary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 复制到从节点
        mirror /mirror_to_secondary;
    }

    location = /mirror_to_secondary {
        internal;
        proxy_pass http://secondary$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 从节点错误不影响主请求
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout;
    }
}


# 场景 8: 日志记录与监控
# 记录复制请求的结果
upstream prod_backend {
    server 127.0.0.1:8080;
}

upstream test_backend {
    server 127.0.0.1:9000;
}

log_format main_with_mirror_status '$remote_addr - $remote_user [$time_local] '
                                   '"$request" $status $body_bytes_sent '
                                   '"$http_referer" "$http_user_agent" '
                                   'mirror_status:$mirror_status';

server {
    listen 80;
    server_name www.example.com;
    access_log /var/log/nginx/access_with_mirror.log main_with_mirror_status;

    location / {
        proxy_pass http://prod_backend;
        mirror /mirror_test;
        
        # 设置变量记录 mirror 响应
        set $mirror_status "";
        
        proxy_set_header Host $host;
    }

    location = /mirror_test {
        internal;
        proxy_pass http://test_backend$request_uri;
        
        # 记录 mirror 响应状态
        proxy_set_header Host $host;
        
        # 记录 mirror 响应头
        add_header X-Mirror-Upstream-Status $upstream_status always;
        
        # 保存 mirror 状态到变量（需要额外模块）
    }
}


# ==========================================
# 使用说明
# ==========================================
#
# 1. 检查 Nginx 是否包含 mirror 模块:
#    nginx -V 2>&1 | grep -E "(http_mirror|--with-http_mirror_module)"
#
# 2. 如果没有包含，需要重新编译:
#    ./configure --with-http_mirror_module ...
#
# 3. 配置测试:
#    nginx -t
#
# 4. 重载配置:
#    systemctl reload nginx
#
# 5. 验证流量复制:
#    tail -f /var/log/nginx/access.log
#    curl http://www.example.com/test
#
# ==========================================
