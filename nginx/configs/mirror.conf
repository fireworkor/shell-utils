# ==========================================
# Nginx 流量复制配置示例
# 需要: Nginx 1.13.4+ (包含 ngx_http_mirror_module)
# ==========================================

# 场景 1: 基础流量复制 (一份流量)
# 将线上流量复制一份到测试环境，用于对比测试
upstream prod_backend {
    server 127.0.0.1:8080;
}

upstream test_backend {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name www.example.com;

    location / {
        # 主请求 - 生产环境
        proxy_pass http://prod_backend;
        
        # 流量复制 - 测试环境
        mirror /mirror_test;
        
        # 其他代理配置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 复制的请求
    location = /mirror_test {
        internal;  # 内部使用，外部不可访问
        proxy_pass http://test_backend$request_uri;
        
        # 传递请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 忽略复制请求的超时和错误（不影响主请求）
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream timeout error invalid_header;
    }
}


# 场景 2: 复制多份流量 (Nginx 1.17.1+)
upstream prod_backend {
    server 127.0.0.1:8080;
}

upstream test_env1 {
    server 127.0.0.1:9001;
}

upstream test_env2 {
    server 127.0.0.1:9002;
}

upstream test_env3 {
    server 127.0.0.1:9003;
}

server {
    listen 80;
    server_name www.example.com;

    location / {
        proxy_pass http://prod_backend;
        
        # 复制到多个测试环境
        mirror /mirror1;
        mirror /mirror2;
        mirror /mirror3;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /mirror1 {
        internal;
        proxy_pass http://test_env1$request_uri;
        proxy_set_header Host $host;
    }

    location = /mirror2 {
        internal;
        proxy_pass http://test_env2$request_uri;
        proxy_set_header Host $host;
    }

    location = /mirror3 {
        internal;
        proxy_pass http://test_env3$request_uri;
        proxy_set_header Host $host;
    }
}


# 场景 3: 条件流量复制
# 只复制特定请求路径或特定来源IP的流量
upstream prod_backend {
    server 127.0.0.1:8080;
}

upstream test_backend {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name www.example.com;

    location / {
        proxy_pass http://prod_backend;
        
        # 条件: 只复制 /api/ 开头的请求
        if ($request_uri ~ ^/api/) {
            mirror /mirror_test;
        }
        
        proxy_set_header Host $host;
    }

    location = /mirror_test {
        internal;
        proxy_pass http://test_backend$request_uri;
        proxy_set_header Host $host;
    }
}


# 场景 4: 修改复制请求
# 复制请求时可以修改请求头
upstream prod_backend {
    server 127.0.0.1:8080;
}

upstream analysis_backend {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name www.example.com;

    location / {
        proxy_pass http://prod_backend;
        mirror /mirror_analysis;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /mirror_analysis {
        internal;
        proxy_pass http://analysis_backend$request_uri;
        
        # 修改请求头
        proxy_set_header Host analysis.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Mirror-Request "true";
        proxy_set_header X-Original-Host $host;
        
        # 不传递原始请求体
        proxy_pass_request_body off;
    }
}


# 场景 5: 带请求体的流量复制
# 对于 POST/PUT 等带请求体的请求
upstream prod_backend {
    server 127.0.0.1:8080;
}

upstream test_backend {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name www.example.com;

    # 必须先读取请求体
    client_body_in_single_buffer on;
    client_max_body_size 100M;
    client_body_buffer_size 128K;

    location / {
        proxy_pass http://prod_backend;
        
        # 确保请求体读取完毕
        mirror /mirror_with_body;
        mirror_request_body on;
        
        proxy_set_header Host $host;
    }

    location = /mirror_with_body {
        internal;
        proxy_pass http://test_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
    }
}


