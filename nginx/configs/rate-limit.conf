# 限流配置示例
# 需要在http块定义limit_req_zone和limit_conn_zone

# 基于IP的请求限流
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

# 基于IP的连接数限制
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# 基于server_name的限流
limit_req_zone $server_name zone=server_limit:10m rate=100r/s;

server {
    listen 80;
    server_name ratelimit.example.com;
    
    root /var/www/ratelimit;
    index index.html;
    
    # 连接数限制
    limit_conn conn_limit 10;
    limit_conn_log_level warn;
    
    # 请求限流 - 普通限制
    location / {
        limit_req zone=req_limit burst=20 nodelay;
        try_files $uri $uri/ =404;
    }
    
    # 请求限流 - 严格限制（API）
    location /api/ {
        limit_req zone=req_limit burst=5 nodelay;
        
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 上传接口 - 更严格限制
    location /upload/ {
        limit_req zone=req_limit burst=2 nodelay;
        client_max_body_size 10M;
        
        proxy_pass http://127.0.0.1:8080/upload/;
    }
    
    # 登录接口 - 特殊限制
    location /login/ {
        # 限制每分钟60次尝试
        limit_req zone=req_limit burst=10 nodelay;
        
        # 记录被限制的请求
        limit_req_log_level warn;
        limit_req_status 429;
        
        proxy_pass http://127.0.0.1:8080/login/;
    }
}

