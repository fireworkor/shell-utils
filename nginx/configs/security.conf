# Nginx 安全加固配置
# 将此文件内容添加到server块或nginx.conf的http块

# 隐藏Nginx版本号
server_tokens off;

# 安全响应头
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# 可选：Content-Security-Policy
# add_header Content-Security-Policy "default-src 'self';" always;

# 禁用目录浏览
autoindex off;

# 禁止访问敏感文件
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# 禁止访问常见配置文件
location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# 禁止访问备份文件
location ~* \.(bak|backup|old|orig|original|test)$ {
    deny all;
}

# 限制HTTP方法
# location / {
#     if ($request_method !~ ^(GET|POST|HEAD)$ ) {
#         return 405;
#     }
# }

# 防止SQL注入
# location ~* {
#     if ($query_string ~ ".*(;|<|>|'|\\").*") {
#         return 444;
#     }
# }

# 防止XSS攻击
# location ~* {
#     if ($args ~* "<(.*)") {
#         return 444;
#     }
# }

# 防止脚本执行
location ~* \.(php|jsp|cgi|asp|aspx|py|pl|sh|bash)$ {
    deny all;
}

# 限制IP访问（需要realip模块）
# set_real_ip_from 192.168.1.0/24;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# 请求大小限制
client_max_body_size 10M;
client_body_buffer_size 128k;

# 超时设置
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 15s;
send_timeout 10s;

# 缓冲区限制
client_body_buffer_size 256k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
