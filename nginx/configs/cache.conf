# 代理缓存配置示例
# 需要proxy_cache_path指令

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache_static:10m 
                 max_size=10g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name cdn.example.com;
    
    root /var/www/static;
    index index.html;
    
    # 定义缓存区域
    proxy_cache cache_static;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    
    # 添加缓存头
    add_header X-Cache-Status $upstream_cache_status;
    
    # 日志
    access_log /var/log/nginx/cdn_access.log;
    error_log /var/log/nginx/cdn_error.log;
    
    location / {
        # 使用本地文件
        try_files $uri $uri/ =404;
    }
    
    # 反向代理缓存示例
    location /api/ {
        proxy_pass http://backend_api;
        
        proxy_cache cache_static;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        
        # 缓存控制
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        add_header X-Cache-Status $upstream_cache_status;
        
        # 不缓存的请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 清除缓存（需要ngx_cache_purge模块）
    # location ~ /purge(/.*) {
    #     proxy_cache_purge cache_static "$scheme$request_method$host$1";
    # }
    
    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # 开启gzip压缩
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
    }
}
