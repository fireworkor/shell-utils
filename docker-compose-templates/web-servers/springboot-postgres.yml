version: '3.8'
services:
  app:
    build: .
    container_name: springboot_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/springbootdb
      - SPRING_DATASOURCE_USERNAME=springuser
      - SPRING_DATASOURCE_PASSWORD=springpass
    depends_on:
      - postgres
    networks:
      - springnet
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: spring_postgres
    environment:
      POSTGRES_DB: springbootdb
      POSTGRES_USER: springuser
      POSTGRES_PASSWORD: springpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springnet
    restart: always

volumes:
  postgres_data:

networks:
  springnet:
