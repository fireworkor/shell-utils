version: '3.8'
services:
  vue:
    build:
      context: .
      target: development
    container_name: vue_app
    volumes:
      - ./app:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
    networks:
      - vuenet
    restart: always

  nginx:
    image: nginx:alpine
    container_name: vue_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/dist:/usr/share/nginx/html:ro
    depends_on:
      - vue
    networks:
      - vuenet
    restart: always

networks:
  vuenet:
