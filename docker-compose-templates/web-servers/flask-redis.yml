version: '3.8'
services:
  flask:
    build: .
    container_name: flask_app
    command: flask run --host=0.0.0.0 --port=5000
    volumes:
      - ./app:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - flasknet
    restart: always

  redis:
    image: redis:7-alpine
    container_name: flask_redis
    volumes:
      - redis_data:/data
    networks:
      - flasknet
    restart: always

volumes:
  redis_data:

networks:
  flasknet:
