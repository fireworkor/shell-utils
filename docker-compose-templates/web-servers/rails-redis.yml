version: '3.8'
services:
  rails:
    build: .
    container_name: rails_app
    command: rails s -p 3000 -b '0.0.0.0'
    volumes:
      - ./app:/rails
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rails_development
    depends_on:
      - postgres
      - redis
    networks:
      - railsnet
    restart: always

  postgres:
    image: postgres:15
    container_name: rails_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rails_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - railsnet
    restart: always

  redis:
    image: redis:7-alpine
    container_name: rails_redis
    volumes:
      - redis_data:/data
    networks:
      - railsnet
    restart: always

volumes:
  postgres_data:
  redis_data:

networks:
  railsnet:
