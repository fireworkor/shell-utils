version: '3.8'
services:
  apache:
    image: php:8.2-apache
    container_name: apache_web
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
      - ./apache/sites:/etc/apache2/sites-available
    networks:
      - webnet
    restart: always

  mysql:
    image: mariadb:10.11
    container_name: mariadb_db
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - webnet
    restart: always

volumes:
  mariadb_data:

networks:
  webnet:
