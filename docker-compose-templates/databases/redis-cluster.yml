version: '3.8'
services:
  redis1:
    image: redis:7-alpine
    container_name: redis1
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis1_data:/data
    ports:
      - "6379:6379"
      - "16379:16379"
    networks:
      - redisnet
    restart: always

  redis2:
    image: redis:7-alpine
    container_name: redis2
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    volumes:
      - redis2_data:/data
    ports:
      - "6380:6379"
      - "16380:16379"
    networks:
      - redisnet
    restart: always

  redis3:
